coordinator:
  database_url: "sqlite:///coordinator.db"
  lease_seconds: 30
  heartbeat_seconds: 3
  cookie_secure: true
  allow_test_source: false

agent:
  coordinator_url: "https://localhost:8000"
  ca_cert: "./certs/cert.pem"
  storage_path: "./data"
  threads: 4
  max_height: 720

servers:
  - name: worker-01
    host: local
    storage_path: ./data/worker-01
    threads: 4
    rps: 10
    min_free_space_gb: 1
  - name: worker-02
    host: local
    storage_path: ./data/worker-02
    threads: 6
    rps: 10
    min_free_space_gb: 1
  - name: worker-03
    host: local
    storage_path: ./data/worker-03
    threads: 8
    rps: 10
    min_free_space_gb: 1
