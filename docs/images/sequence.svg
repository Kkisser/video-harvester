<svg xmlns="http://www.w3.org/2000/svg" width="980" height="570" viewBox="0 0 980 570" role="img"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs><rect width="100%" height="100%" fill="#f8fafc"/><g font-family="Arial,sans-serif" font-size="15" fill="#172033"><rect x="25" y="20" width="150" height="50" rx="10" fill="#e6efff" stroke="#a2b3cf"/><text x="100.0" y="47" text-anchor="middle">Агент</text><line x1="100" y1="80" x2="100" y2="535" stroke="#a5b4c8" stroke-dasharray="5 5"/><rect x="385" y="20" width="150" height="50" rx="10" fill="#e6efff" stroke="#a2b3cf"/><text x="460.0" y="47" text-anchor="middle">Координатор</text><line x1="460" y1="80" x2="460" y2="535" stroke="#a5b4c8" stroke-dasharray="5 5"/><rect x="765" y="20" width="150" height="50" rx="10" fill="#e6efff" stroke="#a2b3cf"/><text x="840.0" y="47" text-anchor="middle">SQLite</text><line x1="840" y1="80" x2="840" y2="535" stroke="#a5b4c8" stroke-dasharray="5 5"/><path d="M100,110 L460,110" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><text x="280" y="100" text-anchor="middle" font-size="13">1. lease: прошу блок</text><path d="M460,155 L840,155" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><text x="650" y="145" text-anchor="middle" font-size="13">2. BEGIN IMMEDIATE + назначение</text><path d="M840,200 L460,200" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><text x="650" y="190" text-anchor="middle" font-size="13">3. commit</text><path d="M460,245 L100,245" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><text x="280" y="235" text-anchor="middle" font-size="13">4. блок + lease_token + параметры</text><path d="M100,305 L460,305" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><text x="280" y="295" text-anchor="middle" font-size="13">5. heartbeat продлевает аренду</text><path d="M100,365 L460,365" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><text x="280" y="355" text-anchor="middle" font-size="13">6. progress: конечный результат ID</text><path d="M460,420 L840,420" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><text x="650" y="410" text-anchor="middle" font-size="13">7. проверка токена + запись + checkpoint</text><path d="M460,475 L100,475" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><text x="280" y="465" text-anchor="middle" font-size="13">8. подтверждение сохранения</text><text x="35" y="555" font-size="14">Медиа скачивается между шагами управления; heartbeat не ждёт завершения файла.</text></g></svg>